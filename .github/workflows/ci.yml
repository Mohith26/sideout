# Generated by `no-mistakes ci-workflow` from .no-mistakes.yaml, then adjusted
# for a Node project (the generator's default toolchain step targets Go).
# Keep the `build-test` steps in sync with the `commands` block in
# .no-mistakes.yaml. The `e2e` job is CI-only (see the note in that file).
name: CI

on:
  push:
    branches: ['main']
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    runs-on: ubuntu-latest
    env:
      LUCRA_MODE: mock
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install
        run: npm ci

      - name: Typecheck
        run: |
          npm run typecheck

      - name: Lint
        run: |
          npm run lint

      - name: Test
        run: |
          npm test
          npm run test:bundle

      - name: Build
        run: |
          npm run build

  # The Playwright suite (spec §15.25–26 flows, the offline outbox, axe, the
  # screen pass) against a production build the config starts itself, seeded
  # into its own database with the dev login compiled in.
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      LUCRA_MODE: mock
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: End-to-end
        run: npm run test:e2e

      - name: Upload report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
