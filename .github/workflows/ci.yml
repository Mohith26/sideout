# Generated by `no-mistakes ci-workflow` from .no-mistakes.yaml, then adjusted
# for a Node project (the generator's default toolchain step targets Go).
# Keep the steps in sync with the `commands` block in .no-mistakes.yaml.
name: CI

on:
  push:
    branches: ['main']
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    runs-on: ubuntu-latest
    env:
      LUCRA_MODE: mock
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install
        run: npm ci

      - name: Typecheck
        run: |
          npm run typecheck

      - name: Lint
        run: |
          npm run lint

      - name: Test
        run: |
          npm test
          npm run test:bundle

      - name: Build
        run: |
          npm run build
